spring.application.name=restaurante-api
spring.profiles.default=local
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/restaurantes;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
app.jwt.secret=${JWT_SECRET:mesa-lista-local-dev-secret-change-before-production-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.demo.admin-username=${DEMO_ADMIN_USERNAME:admin}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:AdminDemo2026!}
